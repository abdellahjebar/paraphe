# Tests keep their files under target/, which is never committed.
paraphe.storage.root=target/test-files

# Fast hashing for tests only. The application refuses a cost below 10 unless this flag is set,
# and BCryptPasswordHasherTest checks the production default separately.
paraphe.security.bcrypt-strength=4
paraphe.security.allow-weak-hashing=true

# Test-only endpoints must never appear in the generated contract.
springdoc.paths-to-exclude=/api/probe/**,/other
