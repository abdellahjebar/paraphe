spring:
  application:
    name: paraphe-backend
  datasource:
    # The application runs as a restricted role: it owns nothing and can only do what migration
    # V10 grants it. Local defaults match compose.yaml; production sets these explicitly.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/paraphe}
    username: ${DATABASE_USER:paraphe_app}
    password: ${DATABASE_PASSWORD:paraphe_app_dev}
  flyway:
    # Migrations run as the database owner, never as the application role.
    url: ${MIGRATION_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/paraphe}}
    user: ${MIGRATION_DATABASE_USER:paraphe}
    password: ${MIGRATION_DATABASE_PASSWORD:paraphe}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # A little above paraphe.storage.max-file-size-bytes (25 MB), which is the real limit.
      max-file-size: 26MB
      max-request-size: 27MB
  jackson:
    deserialization:
      # A typo in a field name must fail loudly instead of being silently ignored.
      fail-on-unknown-properties: true

server:
  servlet:
    session:
      # Idle time before a signed-in session ends. Any request starts the period again, and the client
      # warns before it ends (WCAG 2.2.1). Override with SESSION_IDLE_TIMEOUT, for example 30m or 8h.
      timeout: ${SESSION_IDLE_TIMEOUT:60m}
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # true in production (HTTPS); false only so a local http:// session cookie still works.
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    # At DEBUG these log the request path, which on a review link is the secret token.
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.apache.catalina: INFO
    org.apache.coyote: INFO

paraphe:
  # Where reviewers reach the application: prefix of the review links handed to the contractor.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

springdoc:
  # Every JSON answer is declared as application/json, not */*, so a client keeps its types.
  default-produces-media-type: application/json
  # Keep the error schema, which no route references directly, so clients can generate its types.
  remove-broken-reference-definitions: false
  api-docs:
    # The contract is generated from the code. It is only served when asked for (tests, local tooling).
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: false
