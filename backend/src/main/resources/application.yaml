spring:
  application:
    name: paraphe-backend
  datasource:
    # Local defaults match compose.yaml. Production must set DATABASE_* explicitly.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/paraphe}
    username: ${DATABASE_USER:paraphe}
    password: ${DATABASE_PASSWORD:paraphe}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # A little above paraphe.storage.max-file-size-bytes (25 MB), which is the real limit.
      max-file-size: 26MB
      max-request-size: 27MB
  jackson:
    deserialization:
      # A typo in a field name must fail loudly instead of being silently ignored.
      fail-on-unknown-properties: true

server:
  servlet:
    session:
      timeout: 8h
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # true in production (HTTPS); false only so a local http:// session cookie still works.
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    # At DEBUG these log the request path, which on a review link is the secret token.
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.apache.catalina: INFO
    org.apache.coyote: INFO

paraphe:
  # Where reviewers reach the application: prefix of the review links handed to the contractor.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

springdoc:
  api-docs:
    # The contract is generated from the code. It is only served when asked for (tests, local tooling).
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: false
