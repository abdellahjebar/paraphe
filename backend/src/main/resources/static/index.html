<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Paraphe</title>
  <style>
    :root { --bg: #f6f7f9; --ink: #1c2330; --muted: #5d6677; }
    @media (prefers-color-scheme: dark) { :root { --bg: #12161d; --ink: #e8ebf0; --muted: #a0a9b8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { padding: 24px; max-width: 32rem; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Paraphe</h1>
    <p>Le suivi des visas de documents d'exécution.</p>
    <p>L'interface est en cours de construction.</p>
  </main>
</body>
</html>
